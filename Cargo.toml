[package]
name = "rasterxyz"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generate Web Mercator XYZ PNG tiles from georeferenced rasters"
repository = "https://github.com/dalexhu/rasterxyz"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
png = "0.18.1"
proj4rs = { version = "0.3", default-features = false }
roxmltree = "0.20"
rayon = "1.12"
